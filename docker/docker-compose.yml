services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: bolt-portfolio:latest
    ports:
      - "3000:80"
    restart: unless-stopped
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: base
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    volumes:
      - ..:/app
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped

volumes:
  node_modules:
